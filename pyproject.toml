[project]
name = "outfitiq-backend"
version = "2.0.0"
description = "OutfitIQ trend analysis backend — layered FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=1.26,<2.0",
    "pymannkendall>=1.4.3",
    "structlog>=24.4",
]

[project.optional-dependencies]
ml = [
    "torch==2.*",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
