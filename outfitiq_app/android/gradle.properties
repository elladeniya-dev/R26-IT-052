org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin's incremental compiler crashes on Windows when the project
# lives on a different drive than the Gradle/pub cache (D: vs C: here)
# - it tries to compute a relative path between files on different
# drive roots, which is impossible, and the daemon dies with
# "this and base files have different roots". Disabling incremental
# compilation avoids that code path entirely; full compiles are a bit
# slower but reliable.
kotlin.incremental=false
