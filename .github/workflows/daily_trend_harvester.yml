name: OutfitIQ Daily Trend Data Collector

on:
  # 1. Automated Cron Schedule: Executes daily at midnight (00:00 UTC / 5:30 AM Sri Lanka Time)
  schedule:
    - cron: '0 0 * * *'
  
  # 2. Manual Workflow Dispatch: Allows triggering extraction directly via a button click on GitHub
  workflow_dispatch:

permissions:
  contents: write  # Required for committing updated JSON output snapshots back to the repository

jobs:
  harvest:
    name: Run Sri Lankan E-Commerce Harvester
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Extended to 90 minutes to accommodate heavy Playwright/Gemini AI browser extraction loops over 20+ stores

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Up GitHub Runner Disk Space
        run: |
          echo "Freeing up disk space by removing unused bulky software..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo apt-get clean

      - name: Configure Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # Cache covers BOTH requirements files so neither crawler nor ETL reinstalls every day
          cache-dependency-path: |
            trend-data-collector/requirements.txt
            requirements.txt

      - name: Install Harvester & Playwright Browser Dependencies
        working-directory: ./trend-data-collector
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Install the root backend requirements separately so the ETL script can import
      # from app.core.database and app.models without a ModuleNotFoundError
      - name: Install Backend & ETL Dependencies
        working-directory: ./
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Execute Multi-Tier Harvester Pipeline
        working-directory: ./trend-data-collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: ETL Standardization & Database Ingestion
        working-directory: ./
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Suppress Hugging Face symlink warning on Linux runners
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[Notice] DATABASE_URL secret not provided. Skipping DB ingestion."
          else
            python scripts/ingest_garments_etl.py --latest-only
          fi

      # Without this step, Products accumulates daily but TrendObservation/
      # TrendSignal never refresh — the API would keep serving stale trends
      # forever even though new data is being collected every day.
      - name: Rebuild Trend Observations & Signals
        working-directory: ./
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[Notice] DATABASE_URL secret not provided. Skipping trend recomputation."
          else
            python scripts/generate_trend_observations.py
            python scripts/compute_trend_signals.py
            python scripts/joint_trend_forecast.py
          fi

      - name: Upload Downloadable Backup Artifact (ZIP Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: outfitiq-trend-data-${{ github.run_id }}
          path: trend-data-collector/output/
          retention-days: 90

      - name: Auto-Commit Updated JSON Datasets to Repository
        working-directory: ./trend-data-collector
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add output/ || true
          if git diff --staged --quiet; then
            echo "No changes in extracted data to commit."
          else
            git commit -m "chore(data): automated daily trend collection snapshot [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
